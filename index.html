<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  // Tres orígenes de tráfico: festivalcoreanord.com.do (directo), /ig (Instagram) y /tt (TikTok).
  // Las apps abren el sitio en su propio navegador y no siempre dicen de dónde viene la visita
  // (TikTok nunca lo dice). Si el enlace no trae utm_source, se reconoce Instagram o TikTok por su navegador
  // y se le pasa a Analytics como fuente. Todo lo demás cuenta como directo.
  // El origen (red_origen: instagram, tiktok o directo) viaja en todos los eventos de la visita, también en page_view,
  // y se guarda para que los botones y el enlace a Google Play usen el mismo.
  (function () {
    var q = new URLSearchParams(location.search), ua = navigator.userAgent, app = '', red = '';
    var utm = (q.get('utm_source') || '').toLowerCase();
    if (!utm) {
      if (/musical_ly|trill_|Bytedance|TikTok/i.test(ua)) app = 'tiktok';
      else if (/Instagram/.test(ua)) app = 'instagram';
    }
    // Un enlace con etiqueta manda; si no, se mantiene la red con la que empezó la visita.
    if (!utm) try { red = sessionStorage.getItem('red_origen') || ''; } catch (e) {}
    if (!/^(instagram|tiktok|directo)$/.test(red)) red = '';
    if (!red) {
      var ref = '';
      try { var u = new URL(document.referrer); if (u.hostname !== location.hostname) ref = u.hostname.toLowerCase(); } catch (e) {}
      var f = utm || app || ref;
      red = /instagram|^ig$/.test(f) ? 'instagram' : /tiktok/.test(f) ? 'tiktok' : 'directo';
      try { sessionStorage.setItem('red_origen', red); } catch (e) {}
    }
    gtag('set', { red_origen: red });
    if (app) {
      q.set('utm_source', app); q.set('utm_medium', 'app');
      gtag('config', 'G-Q073ND6GGD', { page_location: location.origin + location.pathname + '?' + q + location.hash });
    } else gtag('config', 'G-Q073ND6GGD');
    // Tiempo real: una vez por visita, un evento con el origen en el nombre (llegada_directo, llegada_instagram,
    // llegada_tiktok). El tiempo real de Analytics muestra los nombres de eventos al instante, pero no la fuente de la visita.
    var enviada = '';
    try { enviada = sessionStorage.getItem('llegada_enviada') || ''; } catch (e) {}
    if (enviada !== red) {
      gtag('event', 'llegada_' + red);
      try { sessionStorage.setItem('llegada_enviada', red); } catch (e) {}
    }
  })();
</script>

<title>Festival Coreano RD 2026</title>
<meta name="description" content="Formularios y entrada del Festival Coreano RD, sábado 28 de noviembre de 2026 en el Malecón de Santo Domingo.">
<link rel="icon" href="assets/logo.png">
<meta name="google-site-verification" content="m5EvNS1UbblogTMlpq-ppuZZUgZYnqOOjz6ZH6lhXWU">
<meta name="facebook-domain-verification" content="5dp5u2o7buul19uvscwjt0ymgu2imk">

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<style>
  /* Linktree del Festival Coreano RD 2026 · versión E1 «Cartel compacto».
     Marino liso, logo con contorno blanco arriba a la derecha, trazos rojos de impacto y stickers rojos con borde blanco. */
  body { display: grid; position: relative; isolation: isolate; background-color: var(--marino); color: var(--blanco); }
  .impacto { position: relative; display: inline-block; width: 26px; height: 30px; vertical-align: top; margin-left: 6px; }
  .impacto i { position: absolute; left: 4px; width: 18px; height: 4px; border-radius: 4px; background: var(--rojo); transform-origin: left center; }
  .impacto i:nth-child(1) { top: 4px; transform: rotate(-32deg); }
  .impacto i:nth-child(2) { top: 14px; }
  .impacto i:nth-child(3) { top: 24px; transform: rotate(32deg); }
  header { position: relative; padding: 86px 24px 0; }
  h1 { margin: 0; text-transform: uppercase; font-size: clamp(30px, 9vw, 36px); font-weight: 900; line-height: .94; letter-spacing: -0.02em; }
  h1 span { display: block; }
  h1 .l2 { color: var(--rojo); }
  .logo { position: absolute; top: 14px; right: 18px; width: 84px; height: auto;
    filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff); }

  /* la rueda ocupa el alto que sobra: no quedan huecos muertos */
  .escenario { perspective: 760px; min-height: 0; }
  .item { top: 50%; left: 50%; width: min(344px, calc(100vw - 32px)); height: 56px;
    display: flex; justify-content: center; gap: 12px; align-items: center; padding: 0 14px; /* ícono y texto centrados juntos en el botón */
    border: 3px solid var(--blanco); border-radius: 18px; background: var(--blanco); color: var(--marino);
    backface-visibility: hidden; transition: background-color 220ms ease, color 220ms ease, box-shadow 220ms ease; }
  .disco { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--rojo); color: var(--blanco); transition: background-color 220ms ease, color 220ms ease; }
  .disco .ico-m { width: 24px; height: 24px; }
  .txt { min-width: 0; }
  .item .disco { flex: none; }
  .item .txt { flex: 0 1 auto; }
  .txt b { display: block; font-size: 17px; font-weight: 800; line-height: 1.15; white-space: nowrap; }
  .item.activo { background: var(--rojo); color: var(--blanco); box-shadow: 0 6px 0 rgb(10 18 45 / .45); }
  .item.activo .disco { background: var(--blanco); color: var(--rojo); }
  .item.cerrado { opacity: .55; }
  .item:active { scale: 0.97; }
  .item:focus-visible { outline-color: var(--crema); }

  /* insignias de tienda, negras como las oficiales */
  .insignias { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tienda { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 10px; border-radius: 11px;
    background: #000; border: 1.5px solid #a6a6a6; color: #fff;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Roboto, system-ui, sans-serif; transition: scale 140ms ease-out; }
  .tienda .ico-m { flex: none; width: 26px; height: 26px; }
  .tienda span.txt { min-width: 0; line-height: 1.05; }
  .tienda small { display: block; font-size: 10px; font-weight: 500; letter-spacing: .01em; white-space: nowrap; }
  .tienda b { display: block; font-size: clamp(15px, 4.6vw, 19px); font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  .tienda:active { scale: 0.97; }
  .tienda:focus-visible { outline: 3px solid var(--crema); outline-offset: 3px; }
  .kfeel-mini { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; vertical-align: middle; }
  .kfeel-mini img { width: 20px; height: 20px; border-radius: 5px; box-shadow: 0 0 0 1.5px var(--blanco); display: block; }
  .sticker { flex: none; padding: 1px 9px 2px; border: 2.5px solid var(--blanco); border-radius: 10px; background: var(--rojo); color: var(--blanco);
    font-size: 16px; font-weight: 900; line-height: 1.15; box-shadow: 0 3px 0 rgb(10 18 45 / .45); }
  [data-contador][hidden] { display: none !important; }
  .entrada { margin: 0 0 10px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--crema); }

  body { grid-template-rows: auto minmax(0, 1fr) auto; }
  /* el contador usa la franja vacía junto al logo */
  .contador { position: absolute; top: 16px; left: 24px; display: flex; align-items: baseline; gap: 6px;
    padding: 6px 14px 7px; border-radius: 14px; background: var(--crema); color: var(--marino);
    font-size: 15px; font-weight: 800; box-shadow: 0 4px 0 var(--rojo); rotate: -2deg; }
  .contador strong { font-size: 30px; font-weight: 900; line-height: 1; letter-spacing: -.02em; color: var(--rojo); }
  header { padding-top: 104px; } /* franja más alta: el contador respira sobre el titular */
  .bajada { margin: 14px 0 0; }
  .dia { font-size: clamp(14px, 4.2vw, 16px); font-weight: 900; text-transform: uppercase; line-height: 1.15; }
  .lugar { margin-top: 3px; font-size: 12px; line-height: 1.35; color: var(--crema); }
  .tiendas { padding: 6px 24px max(36px, calc(env(safe-area-inset-bottom) + 16px)); } /* más aire bajo las insignias */
  /* teléfonos plegables abiertos: los botones de la rueda ocupan todo el ancho, alineados con el titular y las tiendas */
  @media (min-width: 600px) { .item { width: calc(100vw - 48px); } }
  @media (max-height: 700px) { body > header { padding-top: 92px; } .tiendas { padding-bottom: max(26px, calc(env(safe-area-inset-bottom) + 12px)); } .contador { top: 12px; } .contador strong { font-size: 24px; } }

  @media (max-height: 700px) {
    header { padding-top: 76px; }
    .logo { width: 74px; top: 10px; }
    h1 { font-size: 29px; }
  }
</style>
</head>
<body>
<noscript><img height="1" width="1" style="display:none" alt=""
src="https://www.facebook.com/tr?id=1114796387611197&ev=PageView&noscript=1"
/></noscript>


  <header>
    <img class="logo entra" style="--n:0" src="assets/logo.png" alt="Festival Coreano RD">
    <p class="contador entra" style="--n:0" data-contador="corto" hidden></p>
    <h1><span class="l1 entra" style="--n:0">¡Sé parte<span class="impacto" aria-hidden="true"><i></i><i></i><i></i></span></span><span class="l2 entra" style="--n:1">del festival!</span></h1>
    <div class="bajada entra" style="--n:2"><p class="dia" style="margin:0">Sábado 28 de noviembre</p><p class="lugar" style="margin:3px 0 0">Explanada Fray Antonio de Montesinos,<br>Malecón de Santo Domingo</p></div>
  </header>
  <nav class="escenario entra" style="--n:3" aria-label="Formularios del festival"></nav>
  <section class="tiendas entra" style="--n:4" aria-label="Descargar KFeel"><p class="entrada"><span class="sticker" aria-label="Entrada: 9.99 dólares">US$9.99</span><span>Tu entrada, en la app <span class="kfeel-mini"><img src="iconos/kfeel.png" alt="" width="20" height="20">KFeel</span></span></p><div class="insignias"></div></section>


<script type="module">
  import { BOTONES, TIENDAS, externo, plazo, vibrarAlCambiar, avisarPendientes, redDeOrigen, enlaceTienda } from './enlaces.js?v=11';
  import { crearRueda } from './rueda.js?v=2';
  avisarPendientes();

  // En el cartel todos los íconos van en blanco dentro de un círculo rojo, como en "¿Cómo acceder?"
  // (el puesto de expositores sale del ícono oficial de la marca, recortado como silueta en PNG)
  const glifo = e => `<span class="ico-m" style="--src:url('iconos/${e.icono.includes('.') ? e.icono : e.icono + '.svg'}')" aria-hidden="true"></span>`;

  const N = BOTONES.length;
  const escenario = document.querySelector('.escenario');
  escenario.innerHTML = [...BOTONES, ...BOTONES].map((e, i) => {
    const pl = plazo(e);
    return `
    <a class="item${pl?.cerrado ? ' cerrado' : ''}" href="${e.url}" data-id="${e.id}"${externo(e)}${i >= N ? ' aria-hidden="true" tabindex="-1"' : ''}>
      <span class="disco">${glifo(e)}</span>
      <span class="txt"><b>${e.titulo}</b></span>
    </a>`;
  }).join('');

  await document.fonts.ready;
  escenario.querySelectorAll('.txt b').forEach(b => {
    for (let t = 17; t > 14 && b.scrollWidth > b.clientWidth; t -= 0.5) b.style.fontSize = `${t - 0.5}px`;
  });

  const R = Math.min(340, escenario.clientHeight * 0.7), GRADOS = 72 / R * 180 / Math.PI;
  let rueda;
  rueda = crearRueda({
    escenario,
    items: [...escenario.querySelectorAll('.item')],
    paso: R * GRADOS * Math.PI / 180,
    toqueDirecto: 2.2, // cualquier botón visible se abre con un toque
    giro: 0,           // quieta: solo se mueve cuando la persona la arrastra
    inicio: 0,         // sin giro de entrada
    // al cargar queda seleccionado el del medio, así se ven los tres formularios
    centro: 1,
    alCuadro: vibrarAlCambiar(() => rueda, N),
    colocar(el, d) {
      const a = d * GRADOS, k = Math.abs(d);
      if (k > 1.7) { el.style.visibility = 'hidden'; return; }
      const r = a * Math.PI / 180;
      el.style.visibility = '';
      el.style.transform = `translate(-50%, -50%) translate3d(0, ${R * Math.sin(r)}px, ${R * (Math.cos(r) - 1)}px) rotateX(${-a}deg)`;
      el.style.opacity = Math.cos(r) ** 1.4 * Math.min(1, Math.max(0, (1.7 - k) / 0.6));
    },
  });

  {
    const hoy = new Date(), fiesta = new Date(2026, 10, 28);
    const dias = Math.round((fiesta - new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate())) / 864e5);
    const verbo = dias === 1 ? 'Falta' : 'Faltan', unidad = dias === 1 ? 'día' : 'días';
    document.querySelectorAll('[data-contador]').forEach(c => {
      if (dias < 0) return;
      const modo = c.dataset.contador;
      c.innerHTML = dias === 0 ? '<strong>¡Es hoy!</strong>'
        : modo === 'pila' ? `<small>${verbo}</small><strong>${dias}</strong><small>${unidad}</small>`
        : `${verbo} <strong>${dias}</strong> ${unidad}${modo === 'frase' ? ' para el festival' : ''}`;
      c.hidden = false;
    });
  }

  // Las insignias de las tiendas, con la red de origen dentro del enlace
  const red = redDeOrigen();
  const glifoTienda = t => `<span class="ico-m" style="--src:url('iconos/${t.icono}.svg')" aria-hidden="true"></span>`;
  document.querySelector('.insignias').innerHTML = TIENDAS.map(t => `
    <a class="tienda" href="${enlaceTienda(t, red)}"${externo(t)} data-boton="${t.titulo}" data-evento="${t.evento}" aria-label="${t.titulo}: ${t.arriba} ${t.abajo}">
      ${glifoTienda(t)}<span class="txt"><small>${t.arriba}</small><b>${t.abajo}</b></span>
    </a>`).join('');

  // Cada toque que abre un enlace se mide en Google Analytics y en el píxel de Meta, con el origen de la visita:
  // · clic_boton (parámetros boton, destino y red_origen) para los informes;
  // · kfeel_iphone / kfeel_android, los eventos clave de las tiendas;
  // · toque_<botón>_<origen> (toque_kpop_tiktok, toque_kfeel_android_instagram…) para el tiempo real,
  //   que muestra los nombres de los eventos al instante pero no sus parámetros.
  function medir(boton, href, evento, id) {
    if (typeof gtag === 'function') {
      gtag('event', 'clic_boton', { boton, destino: href, red_origen: red, transport_type: 'beacon' });
      if (evento) gtag('event', evento, { red_origen: red, transport_type: 'beacon' });
      if (id) gtag('event', `toque_${id}_${red}`, { boton, transport_type: 'beacon' });
    }
    if (typeof fbq === 'function') {
      // Evento estándar, para que los anuncios puedan optimizar hacia él:
      // los formularios cuentan como Lead; las tiendas de KFeel (donde se compra la entrada) como InitiateCheckout
      const esApp = /apps\.apple\.com|play\.google\.com/.test(href);
      const esFormulario = /docs\.google\.com\/forms/.test(href);
      if (esApp) fbq('track', 'InitiateCheckout', { content_name: boton, content_category: 'Entrada en KFeel' });
      else if (esFormulario) fbq('track', 'Lead', { content_name: boton, content_category: 'Formulario' });
      // Evento propio con el nombre de cada botón, igual que en Analytics
      fbq('trackCustom', 'ClicBoton', { boton, destino: href, red_origen: red });
    }
  }

  // Rueda: en fase de burbuja; si la rueda canceló el toque (fue un arrastre), defaultPrevented ya es true y no se cuenta
  escenario.addEventListener('click', e => {
    const a = e.target.closest('.item');
    if (!a || e.defaultPrevented) return;
    const href = a.getAttribute('href');
    if (!href || href.startsWith('#')) return;
    medir(a.querySelector('b').textContent, href, null, a.dataset.id);
  });

  // Insignias de las tiendas
  document.querySelector('.insignias').addEventListener('click', e => {
    const a = e.target.closest('.tienda');
    if (a) medir(a.dataset.boton, a.getAttribute('href'), a.dataset.evento, a.dataset.evento);
  });
</script>
