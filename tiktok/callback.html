<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Autorización recibida · Festival Coreano RD</title>
<link rel="icon" href="../assets/logo.png">
<style>
  :root { --rojo: #e31a26; --marino: #23315b; --papel: #f4f4f2; --humo: #5f6882;
          --letra: "Avenir Next", "Avenir", system-ui, sans-serif; }
  body { margin: 0; background: var(--papel); color: var(--marino); font-family: var(--letra);
         line-height: 1.55; padding: 40px max(20px, env(safe-area-inset-left)) 56px; }
  main { max-width: 680px; margin: 0 auto; }
  .etiqueta { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--humo); }
  h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 900; letter-spacing: -.02em; line-height: 1.1; margin: 8px 0 20px; }
  h1 span { color: var(--rojo); font-weight: 500; }
  h2 { font-size: 18px; margin: 28px 0 6px; }
  p, li { max-width: 65ch; }
  .en { border-left: 4px solid var(--rojo); padding-left: 12px; color: var(--humo); font-size: 14px; }
  a { color: var(--rojo); }
</style>
</head>
<body>
<main>
<div class="etiqueta">Festival Coreano RD 2026 · KFestRD Analíticas</div>
<h1>Autorización <span>recibida</span></h1>
<p>TikTok confirmó el permiso para la app KFestRD Analíticas. Ya puedes cerrar esta pestaña.</p>
<p class="en">Authorization received. You can close this tab.</p>
</main>
</body>
</html>
